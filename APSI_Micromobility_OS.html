<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>APSI – Micromobility OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+Devanagari:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#fff;--bg2:#f1f5f9;--card:#fff;--line:#e2e8f0;--tx:#0f172a;--mu:#5b6b85;--ac:#0f9d78;--ac2:#2563eb;--ok:#16a34a;--warn:#d97706;--bad:#dc2626}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#eef2f7}
body{font-family:Inter,"Noto Sans Devanagari","Noto Sans Bengali",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);line-height:1.55;overflow-x:hidden}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ac2);outline-offset:2px;border-radius:10px}
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);border-inline:1px solid var(--line);padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-weight:800;font-size:.8rem}
.top h1{flex:1;font-size:1.1rem;font-weight:800}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:600;font-size:.85rem;cursor:pointer}
.scr{padding:16px}
.scr[hidden]{display:none}
h2{font-size:1.05rem;margin:22px 0 10px}
.sub{color:var(--mu);font-size:.9rem;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.card p{color:var(--mu);font-size:.9rem}
.card h3{font-size:.98rem;margin-bottom:2px}
.row{display:flex;gap:12px;align-items:flex-start}
.ico{flex:none;display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:rgba(15,157,120,.1);font-size:1.3rem}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);padding:9px 16px;border-radius:999px;font-weight:600;cursor:pointer;white-space:nowrap}
.chips button[aria-pressed="true"]{background:var(--ac2);color:#fff;border-color:var(--ac2)}
.gauge{text-align:center}
.gauge svg{width:100%;max-width:300px;height:auto}
.gt,.gf{fill:none;stroke-width:14;stroke-linecap:round}
.gt{stroke:var(--line)}
.gf{stroke:var(--ok);stroke-dasharray:251.3;stroke-dashoffset:251.3;transition:stroke-dashoffset .3s,stroke .3s}
.gf.warn{stroke:var(--warn)}.gf.bad{stroke:var(--bad)}
.spd{font-size:2.8rem;font-weight:800;line-height:1;margin-top:-38px}
.spd small{font-size:1rem;color:var(--mu);font-weight:400}
.badge{display:inline-block;padding:6px 16px;border-radius:999px;font-weight:700;margin:12px 0;color:#fff;background:var(--ok)}
.badge.warn{background:var(--warn)}.badge.bad{background:var(--bad)}
.msg{background:var(--bg2);border-left:4px solid var(--ok);padding:12px 14px;border-radius:10px;text-align:left;min-height:3.6em;font-size:.92rem}
.msg.warn{border-color:var(--warn)}.msg.bad{border-color:var(--bad)}
input[type=range]{width:100%;accent-color:var(--ac);height:32px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:1px solid var(--line);background:var(--card);padding:14px;border-radius:14px;font-weight:700;cursor:pointer}
.btn.sos{background:var(--bad);color:#fff;border:0}
.btn.pri{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0}
.sosbox{border:2px solid var(--bad);background:#fef2f2;border-radius:18px;padding:16px;margin-bottom:12px}
.sosbox[hidden]{display:none}
.sosbox p{margin-bottom:10px;font-weight:600}
.fbtn{display:flex;gap:12px;width:100%;background:none;border:0;text-align:left;cursor:pointer;align-items:flex-start}
.fbtn .t{flex:1;font-weight:600;line-height:1.35}
.tag{display:block;color:var(--ac2);font-size:.72rem;font-weight:600}
.chev{color:var(--mu);transition:transform .2s}
.fbtn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.fd{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.fd[hidden]{display:none}
.acc{display:flex;justify-content:space-between;gap:8px;margin:8px 0 6px;font-size:.85rem;color:var(--mu)}
.acc b{color:var(--ac)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2))}
dt{color:var(--tx);font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;margin-top:6px}
dd{color:var(--mu);font-size:.88rem}
.node{text-align:center;background:var(--card);border:1px solid var(--ac2);border-radius:14px;padding:12px;font-weight:600;position:relative;margin-bottom:22px}
.node:not(:last-child)::after{content:"↓";position:absolute;left:50%;bottom:-22px;transform:translateX(-50%);color:var(--ac)}
.note{color:var(--mu);font-size:.8rem;text-align:center;margin:18px 0}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{background:none;border:0;padding:6px 2px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mu);font-size:.72rem;font-weight:600;cursor:pointer}
.nav button span:first-child{font-size:1.3rem}
.nav button[aria-selected="true"]{color:var(--ac);background:rgba(15,157,120,.1)}
.card{box-shadow:0 1px 3px rgba(15,23,42,.06)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 1px 3px rgba(15,23,42,.06)}
.stat b{display:block;font-size:1.6rem;font-weight:800;color:var(--ac2)}
.stat span{color:var(--mu);font-size:.8rem}
.veh{align-items:center}.veh .m{flex:1;min-width:0}.veh h3{font-size:.92rem}.veh p{font-size:.8rem}
.st{font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:99px;background:#dcfce7;color:#15803d;white-space:nowrap}
.st.riding{background:#dbeafe;color:#1d4ed8}.st.alert{background:#fee2e2;color:#b91c1c}
.ev{display:flex;gap:8px;font-size:.84rem;padding:8px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border:0}
.ev i{flex:none;width:9px;height:9px;border-radius:50%;margin-top:6px;background:var(--ok)}
.ev i.warn{background:var(--warn)}.ev i.crit{background:var(--bad)}
.ev small{display:block;color:var(--mu)}
.con{background:#0f172a;color:#cbd5e1;border-radius:14px;padding:12px;font:.74rem/1.5 ui-monospace,Menlo,Consolas,monospace;overflow-x:auto}
.con div{margin-bottom:8px;white-space:pre-wrap;word-break:break-all}.con b{color:#34d399}
.nav{grid-template-columns:repeat(8,1fr)}
.ph{margin:0;padding:10px;display:flex;flex-direction:column;gap:8px}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:#f1f5f9}
.ph .btn{padding:10px;font-size:.85rem;text-align:center}
.up{position:relative;display:block}.up:focus-within{outline:3px solid var(--ac2);outline-offset:2px}
.vh{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.nav button{font-size:.58rem;padding:6px 0}.nav button span:first-child{font-size:1.15rem}
.sel{display:block;width:100%;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff;margin:4px 0 10px;font:inherit}
#vmap{width:100%;height:auto;background:#f8fafc;border:1px solid var(--line);border-radius:16px}
.lg{display:flex;gap:14px;font-size:.8rem;color:var(--mu);margin:8px 0 12px;flex-wrap:wrap}
.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.g2 label{display:block;font-size:.8rem;color:var(--mu)}
#repCard .ph{padding:0;margin-bottom:10px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
 <header class="top">
  <div class="logo" aria-hidden="true">AP</div>
  <h1 id="title">APSI</h1>
  <select class="pill" id="langSel" aria-label="Language"><option value="hi">हिन्दी</option><option value="en">English</option><option value="mr">मराठी</option><option value="bn">বাংলা</option></select>
 </header>
 <main>
  <section class="scr" id="s-ride" role="tabpanel" aria-labelledby="t-ride">
   <p class="sub" data-i="rideSub"></p>
   <div class="chips" role="group" aria-label="Surface">
    <button type="button" data-s="road" aria-pressed="true">🛣️ <span data-i="sRoad"></span></button>
    <button type="button" data-s="foot" aria-pressed="false">🚶 <span data-i="sFoot"></span></button>
    <button type="button" data-s="wet" aria-pressed="false">🌧️ <span data-i="sWet"></span></button>
   </div>
   <div class="card gauge" style="margin-top:12px">
    <svg viewBox="0 0 200 110" role="img" data-a="gaugeAria" aria-label="Speedometer" xmlns="http://www.w3.org/2000/svg">
     <path class="gt" d="M20 100 A80 80 0 0 1 180 100"/>
     <path class="gf" id="gf" d="M20 100 A80 80 0 0 1 180 100"/>
    </svg>
    <div class="spd"><span id="spdVal">0</span> <small>km/h</small></div>
    <span class="badge" id="badge">—</span>
    <div class="msg" id="alertMsg" role="status" aria-live="polite"></div>
   </div>
   <div class="card">
    <label for="thr"><strong data-i="lThr"></strong>: <span id="thrVal">0</span> km/h</label>
    <input type="range" id="thr" min="0" max="25" step="1" value="0">
   </div>
   <div class="sosbox" id="sosBox" role="alert" hidden>
    <p id="sosTxt"></p>
    <button type="button" class="btn pri" id="sosCancel" style="width:100%" data-i="sosCancel"></button>
   </div>
   <div class="acts">
    <button type="button" class="btn" id="resetBtn" data-i="bReset"></button>
    <button type="button" class="btn sos" id="sosBtn" data-i="sosBtn"></button>
   </div>
   <div class="acts" style="margin-top:10px">
    <div class="card ph"><img id="helmetImg" alt="Sample photo: rider wearing a helmet"><label class="btn up"><span data-i="bUp"></span><input class="vh" type="file" accept="image/*" capture="user" id="helmetFile"></label><button type="button" class="btn pri" id="helmetBtn" data-i="bHelmet"></button></div>
    <div class="card ph"><img id="parkImg" alt="Sample photo: scooter parked in a bay"><label class="btn up"><span data-i="bUp"></span><input class="vh" type="file" accept="image/*" capture="environment" id="parkFile"></label><button type="button" class="btn pri" id="parkBtn" data-i="bPark"></button></div>
   </div>
   <div class="msg" id="chkMsg" data-i="chkIdle" role="status" aria-live="polite" style="margin-top:10px"></div>
   <h2 data-i="hHelp"></h2><p class="sub" data-i="helpSub"></p>
   <div class="card"><label for="helpLoc" data-i="lMyLoc"></label><select id="helpLoc" class="sel"></select><button type="button" class="btn sos" id="helpBtn" style="width:100%" data-i="bHelpBtn"></button></div>
   <div id="helpBox" aria-live="polite"></div>
   <p class="note" id="syncNote"></p>
  </section>

  <section class="scr" id="s-fleet" role="tabpanel" aria-labelledby="t-fleet" hidden>
   <p class="sub" data-i="fleetSub"></p>
   <div class="stats" id="stats"></div>
   <h2 data-i="hVeh"></h2><div id="vehList"></div>
   <h2 data-i="hFleetD"></h2><div id="doubtFleet"></div>
   <h2 data-i="hEvt"></h2><div id="evtList"></div>
   <h2 data-i="hApi"></h2><div class="con" id="apiLog"></div>
  </section>

  <section class="scr" id="s-map" role="tabpanel" aria-labelledby="t-map" hidden>
   <p class="sub" data-i="mapSub"></p>
   <svg id="vmap" viewBox="0 0 360 430" role="img" aria-label="Varanasi pothole map">
    <path d="M250 0C305 120 305 300 245 430" stroke="#bfdbfe" stroke-width="40" fill="none"/>
    <text x="300" y="250" font-size="11" fill="#60a5fa" transform="rotate(90 300 250)">Ganga</text>
    <g stroke="#cbd5e1" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M130 70L215 170L262 178"/><path d="M130 70L150 230L140 340L232 395"/><path d="M215 170L150 230"/><path d="M245 40L215 170"/><path d="M95 150L150 230"/></g>
    <g id="mapPts"></g>
   </svg>
   <div class="lg"><span><i style="background:#eab308"></i><span data-i="lgLow"></span></span><span><i style="background:#f97316"></i><span data-i="lgMid"></span></span><span><i style="background:#dc2626"></i><span data-i="lgHigh"></span></span><span id="potCount"></span></div>
   <div class="card" id="potInfo" role="status" aria-live="polite"></div>
   <div class="card" id="repCard">
     <h3 data-i="hRep"></h3>
     <div class="ph"><img id="repImg" alt="Sample pothole photo"><label class="btn up"><span data-i="bAddPhoto"></span><input class="vh" type="file" accept="image/*" capture="environment" id="repFile"></label></div>
     <label for="repLoc" data-i="lWhere"></label><select id="repLoc" class="sel"></select>
     <strong data-i="pSev"></strong>
     <div class="chips" role="group" data-a="pSev" style="margin:6px 0 10px"><button type="button" data-sv="1" aria-pressed="false" data-i="lgLow"></button><button type="button" data-sv="2" aria-pressed="true" data-i="lgMid"></button><button type="button" data-sv="3" aria-pressed="false" data-i="lgHigh"></button></div>
     <label for="repNote" data-i="lNote"></label><input id="repNote" class="sel" type="text" maxlength="80">
     <button type="button" class="btn pri" id="repBtn" style="width:100%" data-i="bReport"></button>
    </div>
    <button type="button" class="btn" id="csvBtn" style="width:100%" data-i="bCsv"></button>
  </section>

  <section class="scr" id="s-trip" role="tabpanel" aria-labelledby="t-trip" hidden>
   <p class="sub" data-i="tripSub"></p>
   <div class="card">
    <label for="fromSel" data-i="lFrom"></label><select id="fromSel" class="sel"></select>
    <label for="toSel" data-i="lTo"></label><select id="toSel" class="sel"></select>
    <strong data-i="lTraffic"></strong>
    <div class="chips" role="group" data-a="lTraffic" style="margin:6px 0 12px"><button type="button" data-tr="0" aria-pressed="false" data-i="tLow"></button><button type="button" data-tr="1" aria-pressed="true" data-i="tMed"></button><button type="button" data-tr="2" aria-pressed="false" data-i="tHeavy"></button></div>
    <label for="soc"><strong data-i="lSoc"></strong>: <span id="socVal">80</span>%</label>
    <input type="range" id="soc" min="10" max="100" step="1" value="80">
   </div>
   <div class="card" id="tripRes" role="status" aria-live="polite"></div>
   <h2 data-i="hCalc"></h2>
    <div class="card"><div class="g2"><div><label for="cWh" data-i="lWh"></label><input class="sel" id="cWh" type="number" inputmode="decimal" value="2000"></div><div><label for="cSoh" data-i="lSohIn"></label><input class="sel" id="cSoh" type="number" inputmode="decimal" value="91"></div><div><label for="cCons" data-i="lCons"></label><input class="sel" id="cCons" type="number" inputmode="decimal" value="28"></div><div><label for="cWt" data-i="lWt"></label><input class="sel" id="cWt" type="number" inputmode="decimal" value="75"></div><div><label for="cSpd" data-i="lSpd"></label><input class="sel" id="cSpd" type="number" inputmode="decimal" value="20"></div><div><label for="cTer" data-i="lTer"></label><select class="sel" id="cTer"><option value="1" data-i="terF"></option><option value="1.2" data-i="terH"></option><option value="1.4" data-i="terS"></option></select></div><div><label for="cSoc" data-i="lBat"></label><input class="sel" id="cSoc" type="number" inputmode="decimal" value="80"></div><div><label for="cRes" data-i="lRes"></label><input class="sel" id="cRes" type="number" inputmode="decimal" value="10"></div><div><label for="cDist" data-i="lDist"></label><input class="sel" id="cDist" type="number" inputmode="decimal" value=""></div></div></div>
    <div class="card" id="calcRes" role="status" aria-live="polite"></div>
    <h2 data-i="hHealth"></h2><div class="card" id="healthBox"></div>
  </section>

  <section class="scr" id="s-feat" role="tabpanel" aria-labelledby="t-feat" hidden>
   <div class="chips" id="tabs" role="group" data-a="tabsAria" aria-label="Filter"></div>
   <div style="margin-top:12px" id="featList"></div>
  </section>

  <section class="scr" id="s-real" role="tabpanel" aria-labelledby="t-real" hidden>
   <p class="sub" data-i="realSub"></p>
   <div id="realList"></div>
   <p class="note" data-i="realNote"></p>
  </section>

  <section class="scr" id="s-doubt" role="tabpanel" aria-labelledby="t-doubt" hidden>
   <p class="sub" data-i="doubtSub"></p>
   <div class="card">
    <strong data-i="lCat"></strong>
    <div class="chips" role="group" data-a="lCat" style="margin:6px 0 12px"><button type="button" data-dc="bat" aria-pressed="true"><span aria-hidden="true">🔋</span> <span data-i="cBat"></span></button><button type="button" data-dc="brk" aria-pressed="false"><span aria-hidden="true">🛑</span> <span data-i="cBrk"></span></button><button type="button" data-dc="spd" aria-pressed="false"><span aria-hidden="true">🚦</span> <span data-i="cSpd"></span></button><button type="button" data-dc="hel" aria-pressed="false"><span aria-hidden="true">⛑️</span> <span data-i="cHel"></span></button><button type="button" data-dc="prk" aria-pressed="false"><span aria-hidden="true">🅿️</span> <span data-i="cPrk"></span></button><button type="button" data-dc="oth" aria-pressed="false"><span aria-hidden="true">❓</span> <span data-i="cOth"></span></button></div>
    <label for="dTxt"><strong data-i="lProb"></strong></label>
    <textarea id="dTxt" class="sel" rows="4" maxlength="300"></textarea>
    <button type="button" class="btn pri" id="dBtn" style="width:100%" data-i="bSend"></button>
    <div class="msg" id="dMsg" role="status" aria-live="polite" style="margin-top:10px"></div>
   </div>
   <h2 data-i="hMine"></h2><div id="doubtMine"></div>
  </section>

  <section class="scr" id="s-about" role="tabpanel" aria-labelledby="t-about" hidden>
   <p class="sub" data-i="pitch"></p>
   <h2 data-i="hProblem"></h2><div id="probList"></div>
   <h2 data-i="hFlow"></h2>
   <div role="img" data-a="flowAria" aria-label="Flow">
    <div class="node" data-i="fl1"></div><div class="node" data-i="fl2"></div><div class="node" data-i="fl3"></div><div class="node" style="margin-bottom:12px" data-i="fl4"></div>
   </div>
   <h2 data-i="hRoad"></h2><div id="phaseList"></div>
   <h2 data-i="hBiz"></h2><div id="bizList"></div>
   <p class="note"><strong data-i="fTeam"></strong><br><span data-i="fContact"></span>: <a href="mailto:team@example.com" style="color:var(--ac2)">team@example.com</a></p>
  </section>
 </main>
 <nav class="nav" role="tablist" data-a="navAria" aria-label="Main">
  <button type="button" role="tab" id="t-ride" data-tab="ride" aria-selected="true"><span aria-hidden="true">🛴</span><span data-i="tRide"></span></button>
  <button type="button" role="tab" id="t-fleet" data-tab="fleet" aria-selected="false"><span aria-hidden="true">🛰️</span><span data-i="tFleet"></span></button>
  <button type="button" role="tab" id="t-map" data-tab="map" aria-selected="false"><span aria-hidden="true">🗺️</span><span data-i="tMap"></span></button>
  <button type="button" role="tab" id="t-trip" data-tab="trip" aria-selected="false"><span aria-hidden="true">🔋</span><span data-i="tTrip"></span></button>
  <button type="button" role="tab" id="t-feat" data-tab="feat" aria-selected="false"><span aria-hidden="true">✨</span><span data-i="tFeat"></span></button>
  <button type="button" role="tab" id="t-real" data-tab="real" aria-selected="false"><span aria-hidden="true">📊</span><span data-i="tReal"></span></button>
  <button type="button" role="tab" id="t-doubt" data-tab="doubt" aria-selected="false"><span aria-hidden="true">❓</span><span data-i="tDoubt"></span></button>
  <button type="button" role="tab" id="t-about" data-tab="about" aria-selected="false"><span aria-hidden="true">ℹ️</span><span data-i="tAbout"></span></button>
 </nav>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
